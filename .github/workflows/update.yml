name: Update Registry Mirror

on:
  schedule:
    - cron: '0 * * * *'  # 每小时运行一次
  workflow_dispatch:      # 支持手动触发
  push:
    branches: [master]    # 主分支更新时也运行

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install axios

      - name: Generate registry
        run: node generate.js

      - name: Prepare index.json for pages branch
        run: |
          cp index.json /tmp/index.json
          rm -f index.json

      - name: Checkout pages branch and update
        run: |
          git checkout --orphan pages
          git reset --hard

          cp /tmp/index.json index.json

          echo "" > .nojekyll

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions@users.noreply.github.com'

          git add -f index.json .nojekyll
          git commit -m "Update registry: $(date +'%Y-%m-%d %H:%M')" || true
          git push -f origin pages
